<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Our</title>

    <style>
        .heart
        {
            position: fixed;
            animation: float 3s infinite ease-in-out;
        }
        
        .card
        {
            background-color: white;
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            height: 650px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 1.15);
            border: 3px solid #ffb6c9;
        }

        #question
        {
            color: #d6336c;
            font-size: 32px;
            margin-bottom: 30px;
        }

        button
        {
            border: none;
            font-size: 20px;
            padding: 12px 28px;
            border-radius: 20px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover
        {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        #yesbutton:hover
        {
            transform: scale(1.1);
        }

        #nobutton:hover
        {
            transform: scale(0.95);
        }

        @keyframes float
        {
            0%
            {
                transform: translateY(0);
                opacity: 0.5;
            }
            50%
            {
                transform: translateY(-30px);
                opacity: 1;
            }
            100%
            {
                transform: translateY(0);
                opacity: 0.5;
            }
        }
    </style>
</head>

<body style="background-color: pink; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">

    <div class="heart" style="font-size: 40px; color: #ffb6c1; left: 20%; top: 30%;">♥</div>
    <div class="heart" style="font-size: 30px; color: #ff1493; left: 80%; top: 20%;">♥</div>
    <div class="heart" style="font-size: 25px; color: red; left: 15%; top: 75%; animation-duration: 2.5s;">♥</div>
    <div class="heart" style="font-size: 35px; color: #ff69b4; left: 70%; top: 70%;">♥</div>
    <div class="heart" style="font-size: 20px; color: red; left: 90%; top: 50%;">♥</div>
    <div class="heart" style="font-size: 22px; color: #ff1493; left: 5%; top: 45%; animation-duration: 4s;">♥</div>
    <div class="heart" style="font-size: 38px; color: #ff69b4; left: 85%; top: 85%;">♥</div>
    <div class="heart" style="font-size: 18px; color: #ffb6c1; left: 50%; top: 5%;">♥</div>


    <div class="card">
        <h1 id="question">Will you buy me a new phone ? </h1>

        <img id="gif" src="Cat Please GIF.gif" alt="cute gif" style="width: 400px; height: 400px; border-radius: 20px;">

        <div>
            <button id="yesButton" onclick="sayYes()" style="font-size: 20px; padding: 10px 25px; border-radius: 15px; margin: 10px; cursor: pointer; transition: transform 0.3s;">YES</button>
            <button id="noButton" onclick="sayNo()" style="font-size: 20px; padding: 10px 25px; border-radius: 15px; margin: 10px; cursor: pointer; transition: transform 0.3s;">NO</button>
        </div>
    </div>

    <script>
        let noSize=1;
        let yesSize=1;
        let noclicks = 0
        function sayNo()
        {
            noclicks = noclicks + 1;
            
            if (noclicks==1)
            {
                document.getElementById("question").textContent = ("are you sure?");
                document.getElementById("gif").src="sadaww.gif";
            }
            if (noclicks==2)
            {
                document.getElementById("question").textContent = ("really sure?");
                document.getElementById("gif").src="Black Cat What GIF.gif";
            }
            if (noclicks==3)
            {
                document.getElementById("question").textContent = ("pls pls pls");
                document.getElementById("gif").src="sad2.gif";
            }
            if (noclicks==4)
            {
                document.getElementById("question").textContent = ("think again!");
                document.getElementById("gif").src="angry.gif";
            }
            if (noclicks==5)
            {
                document.getElementById("question").textContent = ("one last try...");
                document.getElementById("gif").src="gif.gif";
            }

            noSize = noSize - 0.25;
            document.getElementById("noButton").style.transform="scale(" + noSize + ")";
            yesSize = yesSize + 0.2;
            document.getElementById("yesButton").style.transform="scale(" + yesSize +")";

        }
        function sayYes()
        {
            document.getElementById("question").textContent= "YAY! I KNEW YOU WOULD SAY YESSS!!";
            document.getElementById("gif").src="hap.gif";

            document.getElementById("yesButton").style.display="none";
        }
    </script>
</body>
</html>
